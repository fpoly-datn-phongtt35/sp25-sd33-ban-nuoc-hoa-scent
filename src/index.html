  <!--Start of Tawk.to Script-->
  <script>
    var Tawk_API = Tawk_API || {};
    var Tawk_LoadStart = new Date();
  
    Tawk_API.onLoad = function () {
      const hideTawkButton = () => {
        const tawkButtons = document.querySelectorAll('.tawk-button, .tawk-min-container');
        tawkButtons.forEach(el => {
          el.style.display = 'none';
        });
      };
  
      // Lặp đi lặp lại để chắc chắn ẩn được kể cả khi widget reload lại
      setInterval(hideTawkButton, 1000);
    };
  </script>
  
  <!--End of Tawk.to Script-->
  <script>
    window.global = window;
    if (typeof global === 'undefined') {
      window.global = globalThis;
    }
  </script>
