<!-- src/app/product-detail/spct-list/spct.component.html -->
<div class="header-section">
  <button class="btn btn-link text-dark fs-4 fw-bold d-flex align-items-center gap-2" (click)="closeDetail()">
    <i class="bi bi-arrow-left fs-3"></i> Quay lại Sản Phẩm
  </button>

  <div class="actions">
    <button class="btn btn-primary" (click)="openModalAddSpct()" *ngIf="userRole !== 'STAFF'">Thêm mới</button>
    <div class="search-box">
      <input type="text" placeholder="Search" />
      <button class="search-btn"><i class="bi bi-search"></i></button>
    </div>
    <button class="export-btn">Export Excel</button>
  </div>
</div>
<div class="container mt-4">
  <h2 class="text-center">Danh sách sản phẩm chi tiết</h2>
  <table class="table">
    <thead class="table-hover">
      <tr>
        <th>Tên sản phẩm</th>
        <th>Dung tích</th>
        <th>Đơn giá</th>
        <th>Số lượng tồn kho</th>
        <th>Trạng thái</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sp of spct">
        <td>{{ sp.sanPham?.tenSanPham }}</td>
        <td>{{ sp.dungTich }} ml</td>
        <td>{{ sp.donGia }} VNĐ</td>
        <td>{{ sp.soLuongTonKho }}</td>
        <td>{{ sp.trangThai === 1 ? 'Đang bán' : 'Ngưng bán' }}</td>
        <td>
          <div class="d-flex gap-2">
            <button class="btn btn-warning btn-sm me-1" (click)="openUpdateSpctModal(sp)" *ngIf="userRole !== 'STAFF'">
              <i class="bi bi-pencil"></i>
            </button>
            <button
              class="btn btn-sm"
              [ngClass]="sp.trangThai === 1 ? 'btn-danger' : 'btn-success'"
              (click)="toggleSpctStatus(sp.idSpct, sp.trangThai)"
              *ngIf="userRole !== 'STAFF'"
            >
              {{ sp.trangThai === 1 ? 'Ngưng bán' : 'Tiếp tục bán' }}
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
