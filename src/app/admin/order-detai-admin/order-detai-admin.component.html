<div class="modal-header">
    <h5 class="modal-title">Chi Tiết Đơn Hàng</h5>
    <button type="button" class="close" (click)="activeModal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <table class="table">
      <thead>
        <tr>
            <th>Ảnh</th>
          <th>Tên Sản Phẩm</th>
          <th>Giá</th>
          <th>Số Lượng</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of order.chiTietDonHangs">
            <td><img [src]="item.spct.imageUrl" alt="Product Image"></td>
          <td>{{ item.spct.sanPham.tenSanPham }}</td>
          <td>{{ item.donGia  }}</td>
          <td>{{ item.soLuong }}</td>
        </tr>
      </tbody>
    </table>
    <div class="total-amount">Tổng tiền: {{ totalAmount | currency:'VND' }}</div>
  </div>
