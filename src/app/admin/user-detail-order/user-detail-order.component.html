<div class="modal-header">
    <h5 class="modal-title">Thông Tin Tài Khoản</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
  </div>
  
  <div class="modal-body">
    <p><strong>👤 Họ Tên:</strong> {{ taiKhoan?.hoTen }}</p>
    <p><strong>📧 Email:</strong> {{ taiKhoan?.email }}</p>
    <p><strong>📞 Số Điện Thoại:</strong> {{ taiKhoan?.sdt }}</p>
    <p><strong>👤 Tên Đăng Nhập:</strong> {{ taiKhoan?.tenDangNhap }}</p>
    <p><strong>🔑 Vai Trò:</strong> {{ taiKhoan?.vaiTro }}</p>
  </div>
  
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeModal()">Đóng</button>
  </div>
