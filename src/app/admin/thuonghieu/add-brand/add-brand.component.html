<h3 class="text-lg font-semibold mb-4">Thêm Thương Hiệu</h3>

<!-- Error Message (Global Error) -->
<div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded mb-4">
  {{ errorMessage }}
</div>

<!-- Add Brand Form -->
<form [formGroup]="brandForm" (ngSubmit)="addThuongHieu()">
  <div class="grid grid-cols-1 gap-4">
    <!-- Tên Thương Hiệu -->
    <div>
      <input
        formControlName="tenThuongHieu"
        placeholder="Tên Thương Hiệu"
        class="p-2 border rounded w-full"
        required
      >
      <div *ngIf="brandForm.get('tenThuongHieu')?.touched && brandForm.get('tenThuongHieu')?.invalid" class="text-red-500 text-sm mt-1">
        <span *ngIf="brandForm.get('tenThuongHieu')?.errors?.['required']">Tên thương hiệu là bắt buộc.</span>
        <span *ngIf="brandForm.get('tenThuongHieu')?.errors?.['maxLength']">Tên thương hiệu tối đa 100 ký tự.</span>
      </div>
    </div>

    <!-- Quốc Gia -->
    <div>
      <input
        formControlName="quocGia"
        placeholder="Quốc Gia"
        class="p-2 border rounded w-full"
        required
      >
      <div *ngIf="brandForm.get('quocGia')?.touched && brandForm.get('quocGia')?.invalid" class="text-red-500 text-sm mt-1">
        <span *ngIf="brandForm.get('quocGia')?.errors?.['required']">Quốc gia là bắt buộc.</span>
        <span *ngIf="brandForm.get('quocGia')?.errors?.['maxLength']">Quốc gia tối đa 100 ký tự.</span>
      </div>
    </div>

    <!-- Mô Tả -->
    <div>
      <input
        formControlName="moTa"
        placeholder="Mô Tả"
        class="p-2 border rounded w-full"
        required
      >
      <div *ngIf="brandForm.get('moTa')?.touched && brandForm.get('moTa')?.invalid" class="text-red-500 text-sm mt-1">
        <span *ngIf="brandForm.get('moTa')?.errors?.['required']">Mô tả là bắt buộc.</span>
        <span *ngIf="brandForm.get('moTa')?.errors?.['maxLength']">Mô tả tối đa 500 ký tự.</span>
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <button
      type="submit"
      [disabled]="brandForm.invalid"
      class="bg-green-500 text-white p-2 rounded hover:bg-green-600 disabled:bg-green-300 disabled:cursor-not-allowed"
    >
      Thêm
    </button>
    <button
      type="button"
      (click)="cancel()"
      class="bg-gray-500 text-white p-2 rounded hover:bg-gray-600"
    >
      Hủy
    </button>
  </div>
</form>
