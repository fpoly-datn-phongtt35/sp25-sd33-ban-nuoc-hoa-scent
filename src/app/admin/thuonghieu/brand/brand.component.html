<!-- MAIN CONTAINER -->
<div class="container mx-auto p-4 max-w-7xl bg-white shadow-md rounded-lg">
  <!-- Header Section -->
  <div class="flex justify-between items-center mb-6 flex-wrap gap-4 border-b pb-4">
    <h2 class="text-3xl font-bold text-gray-800">Quản Lý Thương Hiệu</h2>
    <button
      (click)="openAddModal()"
      class="btn btn-primary bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition duration-300"
    >
      Thêm Thương Hiệu
    </button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4">
    {{ errorMessage }}
  </div>

  <!-- Search Input -->
  <div class="mb-6">
    <div class="relative w-full max-w-md">
      <input
        [formControl]="searchControl"
        type="text"
        class="form-control w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Tìm kiếm thương hiệu (Tên, Quốc gia, Mô tả...)"
      />
      <!-- Search Icon -->
      <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </span>
      <!-- Clear Icon -->
      <button
        *ngIf="searchControl.value"
        (click)="clearSearch()"
        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="flex justify-center mb-6">
    <div class="loading-spinner">
      <svg
        class="animate-spin h-10 w-10 text-blue-500"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8v8h8a8 8 0 01-8 8 8 8 0 01-8-8z"
        ></path>
      </svg>
      <span class="sr-only">Đang tải...</span>
    </div>
  </div>

  <!-- Brand Table -->
  <div class="table-container">
    <table class="w-full">
      <thead>
        <tr class="bg-gray-100">
          <th scope="col" class="p-3 text-left text-gray-600 font-semibold">ID</th>
          <th scope="col" class="p-3 text-left text-gray-600 font-semibold">Tên Thương Hiệu</th>
          <th scope="col" class="p-3 text-left text-gray-600 font-semibold">Quốc Gia</th>
          <th scope="col" class="p-3 text-left text-gray-600 font-semibold">Mô Tả</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let thuongHieu of thuongHieus" class="border-b hover:bg-gray-50 transition duration-200">
          <td class="p-3">{{ thuongHieu.id }}</td>
          <td class="p-3">{{ thuongHieu.tenThuongHieu }}</td>
          <td class="p-3">{{ thuongHieu.quocGia }}</td>
          <td class="p-3">{{ thuongHieu.moTa }}</td>
        </tr>
        <tr *ngIf="!isLoading && thuongHieus.length === 0">
          <td colspan="4" class="p-4 text-center text-gray-500">Không tìm thấy thương hiệu nào.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Controls -->
  <nav aria-label="Page navigation" class="mt-6 flex justify-center">
    <ul class="pagination flex space-x-2">
      <li class="page-item" [class.disabled]="page === 0">
        <button
          class="page-link bg-white border border-gray-300 px-3 py-1 rounded-l hover:bg-gray-100"
          (click)="goToPage(0)"
          aria-label="Trang đầu"
        >
          «
        </button>
      </li>
      <li class="page-item" [class.disabled]="page === 0">
        <button
          class="page-link bg-white border border-gray-300 px-3 py-1 hover:bg-gray-100"
          (click)="prevPage()"
          aria-label="Trang trước"
        >
          ‹
        </button>
      </li>
      <ng-container *ngFor="let p of getPaginationRange()">
        <li
          class="page-item"
          [class.active]="p.page === page"
          [class.disabled]="p.isEllipsis"
        >
          <button
            *ngIf="!p.isEllipsis"
            class="page-link bg-white border border-gray-300 px-3 py-1 hover:bg-gray-100"
            (click)="goToPage(p.page)"
          >
            {{ p.page + 1 }}
          </button>
          <span *ngIf="p.isEllipsis" class="page-link bg-white border border-gray-300 px-3 py-1 text-gray-500">
            ...
          </span>
        </li>
      </ng-container>
      <li class="page-item" [class.disabled]="page >= totalPages - 1">
        <button
          class="page-link bg-white border border-gray-300 px-3 py-1 hover:bg-gray-100"
          (click)="nextPage()"
          aria-label="Trang sau"
        >
          ›
        </button>
      </li>
      <li class="page-item" [class.disabled]="page >= totalPages - 1">
        <button
          class="page-link bg-white border border-gray-300 px-3 py-1 rounded-r hover:bg-gray-100"
          (click)="goToPage(totalPages - 1)"
          aria-label="Trang cuối"
        >
          »
        </button>
      </li>
    </ul>
  </nav>
</div>

<!-- MODALS -->
<ng-container *ngIf="showAddModal">
  <div class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="modal-content bg-white rounded-lg p-6 w-full max-w-md">
      <h3 class="modal-title text-xl font-bold text-gray-800 mb-4">Thêm Thương Hiệu</h3>
      <app-add-brand (close)="closeAddModal()" (brandAdded)="handleBrandAdded($event)"></app-add-brand>
    </div>
  </div>
</ng-container>
