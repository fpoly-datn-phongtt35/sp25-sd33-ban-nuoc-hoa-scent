```html
<div class="modal-header">
  <h5 class="modal-title">Update NhomHuong</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss('Cancel')" aria-label="Close"></button>
</div>
<div class="modal-body">
  <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="tenNhomHuong" class="form-label">Name</label>
      <input type="text" class="form-control" id="tenNhomHuong" formControlName="tenNhomHuong">
      <div *ngIf="updateForm.get('tenNhomHuong')?.invalid && updateForm.get('tenNhomHuong')?.touched"
           class="text-danger">
        Name is required and must be at least 3 characters.
      </div>
    </div>
    <div class="mb-3">
      <label for="mota" class="form-label">Description</label>
      <textarea class="form-control" id="mota" formControlName="mota"></textarea>
      <div *ngIf="updateForm.get('mota')?.invalid && updateForm.get('mota')?.touched"
           class="text-danger">
        Description is required.
      </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="updateForm.invalid">Update</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="activeModal.dismiss('Cancel')">Cancel</button>
  </form>
</div>
```
