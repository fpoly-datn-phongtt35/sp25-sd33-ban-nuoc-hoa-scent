<div class="voucher-container">
  <div class="header d-flex justify-content-between align-items-center mb-3">
    <h2>Voucher</h2>
    <div class="search-container form-inline">
      <input type="text" class="form-control mr-2 search-input" placeholder="Search" aria-label="Search vouchers">
      <button class="btn btn-outline-primary search-btn" aria-label="Search button">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>


  <!-- Toolbar -->
  <div class="toolbar d-flex gap-2 mb-2">
    <button class="btn btn-primary" aria-label="Add new voucher" (click)="openAddVoucherModal()">+ Add</button>

    <div class="flex-grow-1"></div>
    <button class="btn btn-outline-secondary" aria-label="Export data">Export Data</button>
    <select class="form-control sort-dropdown" aria-label="Sort vouchers">
      <option value="id" selected>Sort by: ID</option>
      <option value="name">Name</option>
      <option value="price">Price</option>
      <option value="status">Status</option>
    </select>
  </div>

  <!-- Table -->
<!-- Sử dụng safe navigation operator khi truy cập properties -->
<div >

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Mã giảm giá</th>
            <th>Giá trị</th>
            <th>Ngày bắt đầu</th>
            <th>Ngày hết hạn</th>

            <th>Số lượng</th>
            <th>Giá trị tối đa sd</th>
            <th>Chức năng</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of phieuGiamGias">
            <td>{{ item.id }}</td>
            <td>{{ item.maGiamGia }}</td>
            <td>{{ item.giaTriGiam }}</td>
            <td>{{ item.ngayBatDau }}</td>
            <td>{{ item.ngayHetHan }}</td>
            <td>{{ item.soLuong }}</td>
            <td>{{ item.gia_tri_toi_da }}</td>

            <td>
              <button class="btn btn-warning btn-sm" (click)="openEditVoucherModal(item)">✏️ Sửa</button>
              <button class="btn btn-danger btn-sm" aria-label="Delete selected vouchers" (click)="deleteVoucher(item.id)">Xóa</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
<!-- ✅ Phân trang với Bootstrap -->
<!-- ✅ Phân trang với Bootstrap -->
<!-- ✅ Phân trang đẹp với Bootstrap -->
<nav aria-label="Page navigation">
  <ul class="pagination justify-content-center">

    <!-- Nút "Trang đầu" -->
    <li class="page-item" [class.disabled]="page === 0">
      <button class="page-link" (click)="goToPage(0)">«</button>
    </li>

    <!-- Nút "Trước" -->
    <li class="page-item" [class.disabled]="page === 0">
      <button class="page-link" (click)="prevPage()">‹</button>
    </li>

    <!-- Hiển thị trang đầu nếu page > 2 -->
    <li class="page-item" *ngIf="page > 2">
      <button class="page-link" (click)="goToPage(0)">1</button>
    </li>

    <!-- Dấu "..." nếu cần -->
    <li class="page-item disabled" *ngIf="page > 3">
      <span class="page-link">...</span>
    </li>

    <!-- Hiển thị các trang gần nhất -->
    <li *ngFor="let p of getPaginationRange()" class="page-item" [class.active]="p === page">
      <button class="page-link" (click)="goToPage(p)">{{ p + 1 }}</button>
    </li>

    <!-- Dấu "..." nếu có nhiều trang -->
    <li class="page-item disabled" *ngIf="page < totalPages - 4">
      <span class="page-link">...</span>
    </li>

    <!-- Hiển thị trang cuối nếu page < totalPages - 3 -->
    <li class="page-item" *ngIf="page < totalPages - 3">
      <button class="page-link" (click)="goToPage(totalPages - 1)">{{ totalPages }}</button>
    </li>

    <!-- Nút "Sau" -->
    <li class="page-item" [class.disabled]="page >= totalPages - 1">
      <button class="page-link" (click)="nextPage()">›</button>
    </li>

    <!-- Nút "Trang cuối" -->
    <li class="page-item" [class.disabled]="page >= totalPages - 1">
      <button class="page-link" (click)="goToPage(totalPages - 1)">»</button>
    </li>
  </ul>
</nav>
