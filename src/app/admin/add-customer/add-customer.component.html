<div class="modal-header">
  <h5 class="modal-title">Thêm Khách Hàng</h5>
  <button type="button" class="btn-close" (click)="closeModal()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="customerForm">
    <div class="mb-3">
      <label class="form-label">Tên khách hàng</label>
      <input type="text" class="form-control" formControlName="tenKhachHang">
    </div>
    <div class="mb-3">
      <label class="form-label">Địa chỉ</label>
      <input type="text" class="form-control" formControlName="diaChi">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
    </div>
    <div class="mb-3">
      <label class="form-label">Số điện thoại</label>
      <input type="text" class="form-control" formControlName="sdt">
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeModal()">Hủy</button>
  <button type="button" class="btn btn-primary" (click)="addCustomer()">Lưu</button>
</div>
