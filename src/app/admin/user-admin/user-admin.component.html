<div class="employee-container">
    <div class="header-section">
      <h2>Nhân viên</h2>
      <div class="actions">
        <button class="btn btn-primary">Thêm mới</button>
        <div class="search-box">
          <input type="text" placeholder="Search" />
          <button class="search-btn"><i class="bi bi-search"></i></button>
        </div>
        <button class="export-btn">Export Excel</button>
      </div>
    </div>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>STT</th>
            <th>Tên người dùng</th>
            <th>Username</th>
            <th>Email</th>
            <th>SDT</th>
            <th>Vai trò</th>
            <th>Trạng thái</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let account of accounts; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ account.hoTen }}</td>
            <td>{{ account.tenDangNhap }}</td>
            <td>{{ account.email }}</td>
            <td>{{ account.sdt }}</td>
            <td>{{ account.vaiTro }}</td>
            <td>{{ account.trangThai || 'Đang làm' }}</td>  <!-- Nếu API không có trạng thái thì mặc định là 'Đang làm' -->
            <td class="actions">
              <button class="btn-action edit" ><i class="bi bi-pencil"></i></button>
              <button class="btn-action delete"><i class="bi bi-trash"></i></button>
              <button class="btn-action view"><i class="bi bi-eye"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
      <!-- Pagination -->
<!-- ✅ Phân trang với Bootstrap -->
<!-- ✅ Phân trang với Bootstrap -->
<!-- ✅ Phân trang đẹp với Bootstrap -->
<nav aria-label="Page navigation">
  <ul class="pagination justify-content-center">

    <!-- Nút "Trang đầu" -->
    <li class="page-item" [class.disabled]="page === 0">
      <button class="page-link" (click)="goToPage(0)">«</button>
    </li>

    <!-- Nút "Trước" -->
    <li class="page-item" [class.disabled]="page === 0">
      <button class="page-link" (click)="prevPage()">‹</button>
    </li>

    <!-- Hiển thị trang đầu nếu page > 2 -->
    <li class="page-item" *ngIf="page > 2">
      <button class="page-link" (click)="goToPage(0)">1</button>
    </li>

    <!-- Dấu "..." nếu cần -->
    <li class="page-item disabled" *ngIf="page > 3">
      <span class="page-link">...</span>
    </li>

    <!-- Hiển thị các trang gần nhất -->
    <li *ngFor="let p of getPaginationRange()" class="page-item" [class.active]="p === page">
      <button class="page-link" (click)="goToPage(p)">{{ p + 1 }}</button>
    </li>

    <!-- Dấu "..." nếu có nhiều trang -->
    <li class="page-item disabled" *ngIf="page < totalPages - 4">
      <span class="page-link">...</span>
    </li>

    <!-- Hiển thị trang cuối nếu page < totalPages - 3 -->
    <li class="page-item" *ngIf="page < totalPages - 3">
      <button class="page-link" (click)="goToPage(totalPages - 1)">{{ totalPages }}</button>
    </li>

    <!-- Nút "Sau" -->
    <li class="page-item" [class.disabled]="page >= totalPages - 1">
      <button class="page-link" (click)="nextPage()">›</button>
    </li>

    <!-- Nút "Trang cuối" -->
    <li class="page-item" [class.disabled]="page >= totalPages - 1">
      <button class="page-link" (click)="goToPage(totalPages - 1)">»</button>
    </li>
  </ul>
</nav>
  </div>
