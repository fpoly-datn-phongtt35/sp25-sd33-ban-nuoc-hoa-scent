<!-- shopping-cart.component.html -->
<div class="cart-container">
    <h2>Giỏ hàng của bạn</h2>
    <table>
        <thead>
            <tr>
              <th>
                <input type="checkbox" (change)="toggleSelectAll()" [checked]="isAllSelected">
              </th>
              
                <th>Ảnh</th>
                <th>Sản phẩm</th>
                
                <th>Dung tích</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Xóa</th>
               
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of cartItems; trackBy: trackByProduct">
             <td> <input type="checkbox" (change)="onProductSelect(item, $event)" [checked]="selectedProducts.includes(item)">
             </td>

              <td class="product-info">
                <!-- Kiểm tra lại item.product.imageURL có phải là đường dẫn hợp lệ và item.product có tồn tại -->
                <img [src]="item.product.imageURL" alt="">
              </td>
              <!-- Đảm bảo rằng các thuộc tính productName, price của product được truy cập đúng -->
              <td>{{ item.product.tenSanPham }}</td>
              <td>{{ item.product.dungTich }}</td>
              <td>{{ item.product?.donGia | currency:'VND' }}</td>
              <td>
                <input type="number" class="quantity-input" (ngModelChange)="logQuantityChange(item, $event); updateQuantity(item,$event)" [(ngModel)]="item.quantity" min="1">
              </td>
              
              <td>
                <button class="remove-btn" (click)="removeItem(item.product.idSanPham, item.product.dungTich)">Xóa</button>
            </td>
              <!-- Tính toán tổng giá tiền dựa trên số lượng và giá sản phẩm -->
             
            </tr>
          </tbody>
          
        
    </table>
    <div class="total-container">
        <div class="select-all">
            <h6 >Tất cả ({{ cartItems.length }})</h6>
        </div>
        <div class="total-info">
          <span><strong>Tổng tiền:</strong> {{ totalAmount | number }} VND</span>

            <button class="btn-order" (click)="placeOrder()">Đặt hàng</button>
        </div>
    </div>
</div>
