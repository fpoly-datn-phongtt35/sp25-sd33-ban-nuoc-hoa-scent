<app-header></app-header>

<div class="account-info-container">
  <h2>Thông Tin Tài Khoản</h2>

  <div class="username-display">
    <span class="username-text">{{ userInfo.tenDangNhap }}</span>
  </div>

  <form [formGroup]="updateForm" (ngSubmit)="updateAccount()" class="edit-form">
    <div class="field form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email" class="form-input" />
      <div *ngIf="updateForm.get('email')?.touched && updateForm.get('email')?.errors" class="error">
        <span *ngIf="updateForm.get('email')?.errors?.['required'] || updateForm.get('email')?.errors?.['email']">
          Email không hợp lệ.
        </span>
        <span *ngIf="updateForm.get('email')?.errors?.['duplicateEmail']">
          Email đã tồn tại trong hệ thống.
        </span>
      </div>
    </div>
    <div class="field form-group">
      <label for="fullName">Họ và tên:</label>
      <input id="fullName" type="text" formControlName="fullName" class="form-input" />
      <div *ngIf="updateForm.get('fullName')?.touched && updateForm.get('fullName')?.errors?.['required']" class="error">
        Vui lòng nhập họ và tên.
      </div>
    </div>
    <div class="field form-group">
      <label for="phone">Số điện thoại:</label>
      <input id="phone" type="text" formControlName="phone" class="form-input" />
    </div>
    <div class="form-actions">
      <button type="submit" class="save-btn" [disabled]="updateForm.invalid">Cập nhật thông tin</button>
    </div>
  </form>
</div>
