<app-header></app-header>
<div class="banner">
  <img src="banner1.jpg" alt="Banner Sản Phẩm" class="banner-image" />
</div>

<!-- 🌟 Container chính chia làm 2 cột -->
<div class="main-container row">

  <!-- 📌 Danh mục sản phẩm bên trái -->
  <div class="category-container col-md-3">
    <!-- Bộ lọc theo danh mục -->
    <select class="form-select" (change)="applyFilter('category', $event.target.value)">
      <option value="">Tất cả</option>
      <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
    </select>

    <!-- Bộ lọc theo thương hiệu -->
    <select class="form-select" (change)="applyFilter('brand', $event.target.value)">
      <option value="">Tất cả</option>
      <option *ngFor="let brand of tenThuonghieu" [value]="brand">{{ brand }}</option>
    </select>

    <!-- Bộ lọc theo hương -->
    <select class="form-select" (change)="applyFilter('scent', $event.target.value)">
      <option value="">Tất cả</option>
      <option *ngFor="let scent of tennhomhuongs" [value]="scent">{{ scent }}</option>
    </select>

    <!-- Bộ lọc theo quốc gia -->
    <select class="form-select" (change)="applyFilter('country', $event.target.value)">
      <option value="">Tất cả</option>
      <option *ngFor="let country of quocGia" [value]="country">{{ country }}</option>
    </select>

    <hr class="divider">

    <!-- Bộ lọc giá với thanh trượt có mũi tên -->
    <div class="filter-container">
      <h4>LỌC THEO GIÁ</h4>
      <mat-slider class="price-slider"
        [min]="minPrice"
        [max]="maxPrice"
        [step]="50000">
        <input matSliderStartThumb [(ngModel)]="selectedMinPrice">
        <input matSliderEndThumb [(ngModel)]="selectedMaxPrice">
      </mat-slider>
      <div class="price-range">
        Giá <strong>{{ selectedMinPrice | number }} đ</strong> — <strong>{{ selectedMaxPrice | number }} đ</strong>
      </div>
      <button class="filter-button btn btn-primary" (click)="filterByPrice()">LỌC</button>
    </div>
    <hr class="divider">
  </div>

  <!-- 🛍️ Danh sách sản phẩm bên phải -->
  <div class="product-container col-md-9">

    <!-- 🔎 Ô tìm kiếm + Bộ lọc giá -->
    <div class="search-filter-container">
      <div class="search-box">
        <input type="text" [(ngModel)]="query" placeholder="🔍 Nhập từ khóa tìm kiếm..." class="form-control">
        <button class="search-button btn btn-primary" (click)="onSearch()">Tìm kiếm</button>
      </div>
    </div>

    <!-- 🛍️ Danh sách sản phẩm -->
    <div class="product-grid">
      <div *ngFor="let product of sanPhams" class="product-card" (click)="viewProductDetail(product.idSanPham)">
        <div class="product-image-container">
          <img [src]="product.imageURL" alt="{{ product.tenSanPham }}" class="product-image" />
        </div>
        <div class="product-info">
          <h2 class="product-title">{{ product.tenSanPham }}</h2>
          <p class="product-price">Giá: {{ product.donGia | number }} VND</p>
        </div>
      </div>
    </div>

    <nav class="pagination-container">
      <ul class="pagination">
        <li class="page-item" *ngIf="currentPage > 1">
          <button class="page-link" (click)="onPageChange(1)">First</button>
        </li>
        <li class="page-item" *ngIf="currentPage > 1">
          <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
        </li>
        <ng-container *ngFor="let page of visiblePages || []">
          <li class="page-item" [ngClass]="{ active: page === currentPage }">
            <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
          </li>
        </ng-container>
        <li class="page-item" *ngIf="currentPage < totalPages">
          <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
        </li>
        <li class="page-item" *ngIf="currentPage < totalPages">
          <button class="page-link" (click)="onPageChange(totalPages)">Last</button>
        </li>
      </ul>
    </nav>
  </div>

</div>

<app-footer></app-footer>
