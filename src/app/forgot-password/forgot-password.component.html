<div class="forgot-password-container">
  <div class="forgot-password-form">
    <h2>Quên Mật Khẩu</h2>

    <!-- Bước 1: Nhập email -->
    <div *ngIf="step === 1" class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        placeholder="Nhập email của bạn"
        [class.invalid]="emailInvalid || emailNotFound"
      />
      <span class="error" *ngIf="emailInvalid">Vui lòng nhập email hợp lệ.</span>
      <span class="error" *ngIf="emailNotFound">Email không tồn tại trong hệ thống.</span>
      <button (click)="checkEmail()" class="btn-action" [disabled]="!email || isLoading">
        {{ isLoading ? 'Đang kiểm tra...' : 'Kiểm tra email' }}
      </button>
    </div>

    <!-- Bước 2: Nhập mật khẩu mới -->
    <div *ngIf="step === 2" class="form-group">
      <label for="newPassword">Mật khẩu mới</label>
      <input
        type="password"
        id="newPassword"
        [(ngModel)]="newPassword"
        placeholder="Nhập mật khẩu mới"
        [class.invalid]="newPasswordInvalid"
      />
      <span class="error" *ngIf="newPasswordInvalid">Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</span>
      <button (click)="proceedToOtp()" class="btn-action" [disabled]="!newPassword || isLoading">
        {{ isLoading ? 'Đang xử lý...' : 'Tiếp tục' }}
      </button>
    </div>

    <!-- Bước 3: Nhập OTP -->
    <div *ngIf="step === 3" class="form-group">
      <label for="otp">Mã OTP</label>
      <input
        type="text"
        id="otp"
        [(ngModel)]="otp"
        placeholder="Nhập mã OTP"
        [class.invalid]="otpInvalid"
      />
      <span class="error" *ngIf="otpInvalid">OTP phải là 6 chữ số.</span>
      <button (click)="resetPassword()" class="btn-action" [disabled]="!otp || isLoading">
        {{ isLoading ? 'Đang xử lý...' : 'Xác nhận' }}
      </button>

      <!-- Nút gửi lại OTP -->
      <div class="resend-otp">
        <button
          (click)="resendOtp()"
          class="btn-resend"
          [disabled]="resendDisabled || isLoading"
        >
          Gửi lại OTP
        </button>
        <span *ngIf="resendDisabled" class="countdown">
          ({{ countdown }}s)
        </span>
      </div>
    </div>

    <div class="options">
      <a routerLink="/login">Quay lại đăng nhập</a>
    </div>
  </div>
</div>
