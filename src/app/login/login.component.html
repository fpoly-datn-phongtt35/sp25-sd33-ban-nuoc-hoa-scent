<div class="login-container">
  <div class="login-form">
    <h2>Đăng Nhập</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Nhập tài khoản -->
      <div class="form-group">
        <label for="username">Tài khoản</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Nhập tài khoản"
          [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
        <span class="error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Tài khoản không được để trống.
        </span>
      </div>

      <!-- Nhập mật khẩu -->
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Nhập mật khẩu"
          [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <span class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mật khẩu không được để trống.
        </span>
      </div>

      <!-- Nút đăng nhập -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn-login"
        [class.disabled]="loginForm.invalid"
      >
        Đăng Nhập
      </button>

      <!-- Các tùy chọn khác -->
      <div class="options">
        <a routerLink="/register">Đăng ký tài khoản mới</a>
        <a href="#">Quên mật khẩu?</a>
      </div>
    </form>
  </div>
</div>
