<div class="modal-header">
  <h4 class="modal-title">Đổi Mật Khẩu</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
</div>
<div class="modal-body">
  <!-- Bước 1: Nhập mật khẩu cũ và mật khẩu mới -->
  <div *ngIf="step === 1" class="form-group">
    <label for="oldPassword">Mật khẩu cũ</label>
    <input
      type="password"
      id="oldPassword"
      class="form-control"
      [(ngModel)]="oldPassword"
      placeholder="Nhập mật khẩu cũ"
      [class.is-invalid]="oldPasswordInvalid"
      value=""
      autocomplete="current-password"
    />
    <div class="invalid-feedback" *ngIf="oldPasswordInvalid">Mật khẩu cũ không đúng.</div>

    <label for="newPassword" class="mt-3">Mật khẩu mới</label>
    <input
      type="password"
      id="newPassword"
      class="form-control"
      [(ngModel)]="newPassword"
      placeholder="Nhập mật khẩu mới"
      [class.is-invalid]="newPasswordInvalid"
      autocomplete="new-password"
      value=""
    />
    <div class="invalid-feedback" *ngIf="newPasswordInvalid">
      Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
    </div>

    <label for="confirmNewPassword" class="mt-3">Xác nhận mật khẩu mới</label>
    <input
      type="password"
      id="confirmNewPassword"
      class="form-control"
      [(ngModel)]="confirmNewPassword"
      placeholder="Nhập lại mật khẩu mới"
      [class.is-invalid]="confirmPasswordInvalid"
      autocomplete="new-password"
    />
    <div class="invalid-feedback" *ngIf="confirmPasswordInvalid">
      Mật khẩu xác nhận không khớp.
    </div>
  </div>

  <!-- Bước 2: Nhập OTP -->
  <div *ngIf="step === 2" class="form-group">
    <div class="alert alert-info" role="alert">
      Mã OTP đã được gửi đến {{ maskedEmail }}
    </div>
    <label for="otp">Mã OTP</label>
    <input
      type="text"
      id="otp"
      class="form-control"
      [(ngModel)]="otp"
      placeholder="Nhập mã OTP"
      [class.is-invalid]="otpInvalid"
      autocomplete="off"
    />
    <div class="invalid-feedback" *ngIf="otpInvalid">
      Mã OTP không hợp lệ. Vui lòng nhập mã 6 chữ số.
    </div>
    <button
      (click)="resendOtp()"
      class="btn btn-link"
      [disabled]="resendDisabled"
      autocomplete="off"
    >
      Gửi lại OTP {{ resendDisabled ? '(' + countdown + 's)' : '' }}
    </button>
  </div>
</div>
<div class="modal-footer">
  <!-- Buttons for Step 1 -->
  <ng-container *ngIf="step === 1">
    <button type="button" class="btn btn-secondary" (click)="closeModal()">Đóng</button>
    <button
      (click)="checkOldPassword()"
      class="btn btn-primary"
      [disabled]="!oldPassword || !newPassword || !confirmNewPassword || isLoading"

    >
      {{ isLoading ? 'Đang kiểm tra...' : 'Tiếp tục' }}
    </button>
  </ng-container>

  <!-- Buttons for Step 2 -->
  <ng-container *ngIf="step === 2">

    <button type="button" class="btn btn-secondary" (click)="closeModal()">Đóng</button>
    <button
      (click)="verifyOtpAndChangePassword()"
      class="btn btn-primary"
      [disabled]="!otp || isLoading"
    >
      {{ isLoading ? 'Đang xác nhận...' : 'Xác nhận' }}
    </button>
  </ng-container>
</div>
