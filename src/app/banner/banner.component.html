<div class="container-wrapper">
  <div class="container">
    <!-- Tiêu đề chính -->
    <div class="header-section">
      <h2>Quản lý Banner</h2>
    </div>

    <!-- Form thêm/sửa banner -->
    <div class="banner-form-card">
      <h3>{{ isEditing ? 'Sửa Banner' : 'Thêm Banner Mới' }}</h3>
      <form (ngSubmit)="isEditing ? updateBanner() : createBanner()" class="banner-form">
        <div class="form-group">
          <label for="title">Tiêu đề:</label>
          <input type="text" id="title" [(ngModel)]="formData.title" name="title" required class="form-control">
        </div>

        <div class="form-group">
          <label for="file">Hình ảnh:</label>
          <input type="file" id="file" (change)="onFileChange($event)" [required]="!isEditing" class="form-control">
        </div>

      

        <div class="form-actions">
          <button type="submit" class="btn-submit">{{ isEditing ? 'Cập nhật' : 'Thêm' }}</button>
          <button type="button" *ngIf="isEditing" (click)="resetForm()" class="btn-cancel">Hủy</button>
        </div>
      </form>
    </div>

    <!-- Danh sách banner -->
    <div class="banner-list-card">
      <h3>Danh sách Banner</h3>
      <div class="banner-table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tiêu đề</th>
              <th>Hình ảnh</th>
              
              <th>Trạng thái</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let banner of banners">
              <td>{{ banner.id }}</td>
              <td>{{ banner.title }}</td>
              <td>
                <img [src]="banner.imageUrl" alt="Banner" class="banner-image">
              </td>
              
              <td>
                <span [class]="banner.isActive === 1 ? 'status-active' : 'status-inactive'">
                  {{ banner.isActive === 1 ? 'Hoạt động' : 'Ngừng' }}
                </span>
              </td>
              <td>
                <button class="btn-edit" (click)="startEditing(banner)">Sửa</button>
                <button class="btn-delete" (click)="deleteBanner(banner.id)">Xóa</button>
                <button class="btn-toggle" (click)="toggleStatus(banner.id)">
                  {{ banner.isActive === 1 ? 'Tắt' : 'Bật' }}
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
